  <script>
    const audioPath = "/click.mp3"; // 🔊 Som na raiz do site

    // Função que toca o som
    async function playClickSound() {
      try {
        const response = await fetch(audioPath);
        if (!response.ok) {
          console.warn("O arquivo '/click.mp3' não foi encontrado!");
          return;
        }
        const audio = new Audio(audioPath);
        audio.play();
      } catch (error) {
        console.error("Erro ao tentar tocar o som:", error);
      }
    }

    // Seleciona todos os botões da página
    const buttons = document.querySelectorAll("button");

    buttons.forEach((btn, index) => {
      // Se o botão não tiver id, aplica id automaticamente
      if (!btn.id) {
        btn.id = `playSound_${index + 1}`;
      }

      // Adiciona o evento de clique
      btn.addEventListener("click", playClickSound);
    });
  </script>

        /**
         * Função chamada ao clicar em um idioma.
         * Agora ela usa o 'href' do elemento clicado para o redirecionamento.
         * @param {Event} event O evento de clique.
         * @param {string} lang O código do idioma.
         */
        function handleLanguageClick(event, lang) {
            event.preventDefault(); // Previne o redirecionamento imediato

            // Obtém o URL de destino do atributo href do link
            const targetUrl = event.currentTarget.getAttribute('href');

            const overlay = document.getElementById('transition-overlay');
            const mainContent = document.getElementById('main-content');

            // 1. Inicia a transição (fade out do conteúdo, fade in do overlay)
            mainContent.style.opacity = '0';
            overlay.style.opacity = '1';
            overlay.classList.remove('pointer-events-none');
            
            // Traduz a mensagem de redirecionamento no overlay antes de mostrar
            const currentLang = document.documentElement.lang;
            const redirectMessageEl = overlay.querySelector('[data-translate-key="redirecting"]');
            if (redirectMessageEl) {
                // Certifica-se de que a mensagem é traduzida corretamente
                redirectMessageEl.textContent = translations[currentLang]?.redirecting || translations['en'].redirecting;
            }


            // 2. Salva a escolha e redireciona após a duração da transição
            setTimeout(() => {
                localStorage.setItem(LANG_KEY, lang);
                // Redireciona para o arquivo de destino específico
                window.location.href = targetUrl;
            }, 500); // Espera 500ms (a duração do transition-opacity)
        }

        // Função para traduzir a página com base no idioma
        function translatePage(lang) {
            // Pega as strings do idioma, ou usa 'en' como padrão
            const langStrings = translations[lang] || translations['en'];
            
            // Atualiza o atributo 'lang' da tag <html>
            document.documentElement.lang = lang;

            // Encontra todos os elementos com a chave de tradução
            document.querySelectorAll('[data-translate-key]').forEach(el => {
                const key = el.dataset.translateKey;
                if (langStrings[key]) {
                    // Mantém os emojis no lugar, alterando apenas o texto
                    if (el.children.length > 0 && el.children[0].tagName === 'SPAN') {
                        // Isso é para os botões de idioma
                        el.children[1].textContent = langStrings[key];
                    } else {
                        // Isso é para o título e subtítulo
                        el.textContent = langStrings[key];
                    }
                }
            });
        }

        // Função para detectar o idioma do navegador e aplicar a tradução
        function detectAndSetLanguage() {
            // Pega o idioma do navegador (ex: "en-US", "pt-BR", "es-ES")
            const browserLang = (navigator.language || 'en').toLowerCase();
            let lang = 'en'; // Padrão

            // Mapeamento de idiomas suportados
            if (browserLang.startsWith('pt')) {
                lang = 'pt-br';
            } else if (browserLang.startsWith('es')) {
                lang = 'es';
            } else if (browserLang.startsWith('fr')) {
                lang = 'fr';
            } else if (browserLang.startsWith('de')) {
                lang = 'de';
            } else if (browserLang.startsWith('ru')) {
                lang = 'ru';
            } else if (browserLang.startsWith('en')) {
                lang = 'en';
            }
            // Se não for nenhum desses, o padrão 'en' será usado

            translatePage(lang);
        }

        // --- GERENCIAMENTO DO MODO CLARO/ESCURO ---
        
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Função para inicializar o modo escuro
        function initDarkMode() {
            const theme = localStorage.getItem('theme');
            // Prioriza a escolha do usuário, se não houver, usa a preferência do dispositivo
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            }
        }

        // Função para alternar o modo
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            darkIcon.classList.toggle('hidden', !isDark);
            lightIcon.classList.toggle('hidden', isDark);
        }

        // Adiciona o listener ao botão de alternância
        themeToggleBtn.addEventListener('click', toggleDarkMode);

        // --- INICIALIZAÇÃO DA PÁGINA ---
        
        // Espera o DOM carregar para rodar os scripts de inicialização
        document.addEventListener('DOMContentLoaded', () => {
            // (A lógica de redirecionamento já rodou lá em cima)
            
            // Se não fomos redirecionados, inicializa a página de seleção:
            initDarkMode();
            detectAndSetLanguage();
        });

        // Adiciona um listener extra para desabilitar o clique direito em todo o documento
        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
